    { name = "Chiranthan N S", email = "chiranthanns24056@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "bcrypt==5.0.0",
    "fastapi==0.115.0",
    "google-auth==2.35.0",
    "google-generativeai==0.8.3",
    "httpx==0.27.2",
    "psycopg[binary]==3.3.6",
